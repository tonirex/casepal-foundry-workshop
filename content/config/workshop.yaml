# content/config/workshop.yaml
# CasePal Foundry Workshop configuration.
workshop:
  name: "CasePal Foundry Workshop"
  date: "2026-09-XX"
  access_code: "CASEPAL26"
  facilitator_email: "facilitator@example.test"

  industry: case-review-agents
  default_theme: system

  branding:
    organisation_name: "the Agency"
    foundry_project: "casepal-workshop"

  rails_enabled: true
  default_rail: navigator
  rails: [navigator, builder]
  agent_validation: true
  agent_naming_convention: "casepal-<initials>"
  cohort_size: 20
  stuck_threshold_attempts: 3

  labs:
    - id: lab-00
      title: "Hello, CasePal"
      is_active: false
      tiers: [navigator, builder]
      required_rails: [navigator]
    - id: lab-01
      title: "Intake & Extraction"
      is_active: false
      tiers: [navigator, builder]
    - id: lab-02
      title: "Knowledge & Institutional Memory"
      is_active: false
      tiers: [navigator, builder]
    - id: lab-03
      title: "Govern & Observe"
      is_active: false
      tiers: [navigator, builder]
    - id: lab-04
      title: "Multi-Agent CasePal"
      is_active: false
      tiers: [navigator, builder]
    - id: lab-05
      title: "Extend & Deploy"
      is_active: false
      tiers: [builder]
      fallback_demo_only: true
      publish_demo_only: true

  models:
    teaching_default: "model-router"
    reasoning: "gpt-5.5"
    fast: "gpt-5.4-mini"
    embeddings: "text-embedding-3-small"
    deployment_type: "Global Standard"
