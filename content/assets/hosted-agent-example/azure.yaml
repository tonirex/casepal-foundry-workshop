# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: casepal-hosted-concierge
services:
    casepal-hosted-concierge:
        project: src/casepal-hosted-concierge
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: CasePal Concierge — Agent Framework container hosted by Foundry Agent Service (Lab 5 Part B).
        kind: hosted
        metadata:
            tags:
                - CasePal
                - Agent Framework
                - Hosted Agent
                - Responses Protocol
                - Lab 5
        name: casepal-hosted-concierge
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5-mini
                version: "2025-08-07"
              name: gpt-5-mini
              sku:
                capacity: 300
                name: GlobalStandard
infra:
    provider: microsoft.foundry
